<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520">
<title>Illustration: square [1,3] squared intersected with |x-y| &lt;= z. The display uses z=0.8 solely to show the general strip.</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#243648"/></marker></defs>
<rect width="640" height="520" fill="white"/><g font-family="Cambria,Times New Roman,serif" font-size="22" fill="#243648" stroke-linejoin="round"><rect x="200" y="55" width="270" height="270" fill="#edf2f8" stroke="#51687d" stroke-width="2"/><polygon points="200,217 362,55 470,55 470,163 308,325 200,325" fill="#b8d3ee" stroke="#315e8d" stroke-width="2"/><path d="M40 460 H570 M65 460 V25" fill="none" stroke="#243648" stroke-width="2" marker-end="url(#arrow)"/><text x="578" y="468">x</text><text x="46" y="24">y</text><text x="42" y="479">0</text><text x="193" y="487">1</text><text x="463" y="487">3</text><text x="34" y="332">1</text><text x="34" y="62">3</text><path d="M200 325 H65 M200 325 V460 M470 325 V460 M200 55 H65" stroke="#9baebf" stroke-dasharray="5 5" fill="none"/><text x="270" y="185">|x − y| ≤ z</text><text x="274" y="224" font-size="18">0 &lt; z &lt; 2</text><text x="118" y="160" font-size="18">y = x + z</text><text x="423" y="280" font-size="18">y = x − z</text></g></svg>